services:
  postgres-shard-0:
    image: postgres:16-alpine
    container_name: urlshortener-postgres-shard-0
    environment:
      POSTGRES_DB: urlshortener_0
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_shard_0:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-shard-1:
    image: postgres:16-alpine
    container_name: urlshortener-postgres-shard-1
    environment:
      POSTGRES_DB: urlshortener_1
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_shard_1:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-shard-2:
    image: postgres:16-alpine
    container_name: urlshortener-postgres-shard-2
    environment:
      POSTGRES_DB: urlshortener_2
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres_shard_2:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: urlshortener-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: urlshortener-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: urlshortener-kafka
    depends_on:
      zookeeper:
        condition: service_started
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: urlshortener-app
    depends_on:
      postgres-shard-0:
        condition: service_healthy
      postgres-shard-1:
        condition: service_healthy
      postgres-shard-2:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      APP_SHARDS_SHARDS_0_NAME: shard-0
      APP_SHARDS_SHARDS_0_URL: jdbc:postgresql://postgres-shard-0:5432/urlshortener_0
      APP_SHARDS_SHARDS_0_USERNAME: postgres
      APP_SHARDS_SHARDS_0_PASSWORD: postgres
      APP_SHARDS_SHARDS_0_DRIVER-CLASS-NAME: org.postgresql.Driver
      APP_SHARDS_SHARDS_1_NAME: shard-1
      APP_SHARDS_SHARDS_1_URL: jdbc:postgresql://postgres-shard-1:5432/urlshortener_1
      APP_SHARDS_SHARDS_1_USERNAME: postgres
      APP_SHARDS_SHARDS_1_PASSWORD: postgres
      APP_SHARDS_SHARDS_1_DRIVER-CLASS-NAME: org.postgresql.Driver
      APP_SHARDS_SHARDS_2_NAME: shard-2
      APP_SHARDS_SHARDS_2_URL: jdbc:postgresql://postgres-shard-2:5432/urlshortener_2
      APP_SHARDS_SHARDS_2_USERNAME: postgres
      APP_SHARDS_SHARDS_2_PASSWORD: postgres
      APP_SHARDS_SHARDS_2_DRIVER-CLASS-NAME: org.postgresql.Driver
      APP_SHARDS_VIRTUAL-NODES: 150
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: urlshortener-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.1.0
    container_name: urlshortener-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning

volumes:
  postgres_shard_0:
  postgres_shard_1:
  postgres_shard_2:
  redis_data:
  grafana_data:
